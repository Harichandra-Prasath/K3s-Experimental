apiVersion: v1
kind: ConfigMap
metadata:
  name: rmq-config
data:
  rabbitmq.conf: |
    cluster_formation.peer_discovery_backend = rabbit_peer_discovery_dns
    cluster_formation.dns.hostname=rmq-headless.rmq-cluster.svc.cluster.local
    cluster_name=k3s-rabbit
  enabled_plugins: |
    [rabbitmq_management, rabbitmq_peer_discovery_dns].

---

apiVersion: v1
kind: Secret
metadata:
  name: rmq-secret
stringData:
  erlang-cookie: "Axudawn!"

---

apiVersion: v1
kind: Service
metadata:
  name: rmq-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 5672
      name: amqp
    - port: 15672
      name: management
    - port: 4369
      name: epmd
    - port: 25672
      name: dist
  selector:
    app: rmq

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rmq
spec:
  serviceName: "rmq-headless"
  replicas: 3
  selector:
    matchLabels:
      app: rmq
  template:
    metadata:
      labels:
        app: rmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rmq-secret
                  key: erlang-cookie
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME).rmq-headless.rmq-cluster.svc.cluster.local"
          volumeMounts:
            - name: config-vol
              mountPath: /etc/rabbitmq
      volumes:
        - name: config-vol
          configMap: 
            name: rmq-config
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmq-ingress
spec:
  ingressClassName: haproxy
  rules:
  - host: rmq.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rmq-headless
            port:
                name: management
